name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Package.swift targets .macOS(.v26), so the job needs the macOS 26 SDK.
    # `macos-26` is the expected label of GitHub's macOS 26 image; if the build fails to find a
    # runner, check https://github.com/actions/runner-images for the current label and change it here.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          sw_vers
          xcrun --show-sdk-version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
